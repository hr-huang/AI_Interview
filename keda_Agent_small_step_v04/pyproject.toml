[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keda-profile-agent"
version = "0.4.0"
description = "Small-step pre-interview Agent learning project"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pymupdf>=1.26",
    "python-docx>=1.2",
    "rapidocr>=3.9.0",
    "onnxruntime>=1.22",
    "langgraph-checkpoint-sqlite>=3.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["profile_agent*"]
