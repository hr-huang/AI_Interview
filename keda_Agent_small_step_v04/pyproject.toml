[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keda-profile-agent"
version = "0.4.0"
description = "Small-step pre-interview Agent learning project"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["profile_agent*"]
